# بناء تطبيق أندرويد وإخراج ملف APK داخل المستودع.
#
# البناء يحتاج حزمةَ تطوير أندرويد (Android SDK)، وهي محجوبةٌ عن بيئة التطوير
# التي كُتب فيها هذا المشروع (مضيف جوجل ممنوعٌ بسياسة الشبكة). أمّا خوادم
# GitHub فتأتي بالحزمة مثبّتةً، فيُبنى التطبيق هنا.
#
# التشغيل: تبويب Actions ← «بناء تطبيق أندرويد» ← Run workflow، ويُطلب منك
# عنوانُ الموقع المنشور. والنتيجة ملفٌّ في APK/ داخل المستودع.
name: بناء تطبيق أندرويد

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "عنوان الموقع المنشور، مثال https://example.com (اتركه فارغًا لاستعمال المتغيّر WEBSITE_URL من إعدادات المستودع)"
        required: false
        default: ""
      commit_apk:
        description: "حفظ الـAPK في مجلد APK/ داخل المستودع"
        type: boolean
        default: true
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تهيئة حزمة أندرويد
        uses: android-actions/setup-android@v3

      - name: تحديد عنوان الموقع
        id: site
        run: |
          URL="${{ github.event.inputs.website_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.WEBSITE_URL }}"; fi
          if [ -z "$URL" ]; then
            echo "::error::لم يُحدَّد عنوان الموقع. مرّره عند التشغيل أو اضبط المتغيّر WEBSITE_URL في Settings → Variables."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "سيُبنى التطبيق على: $URL"

      - name: تجهيز مفتاح التوقيع (إن وُجد)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # المفتاح لا يدخل المستودع أبدًا: يُقرأ من أسرار GitHub، ويُكتب في
          # ملفٍ مؤقّت داخل بيئة البناء وحدها. وإن لم يوجد وُقّع البناء بمفتاح
          # التطوير الافتراضي — يُثبَّت على الأجهزة ولا يصلح لمتجر Play.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "مفتاح الإصدار جاهز."
          else
            echo "لا يوجد مفتاح إصدار — سيُوقَّع بمفتاح التطوير."
          fi

      - name: بناء التطبيق
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PWEBSITE_URL="${{ steps.site.outputs.url }}"

      - name: بصمة التوقيع (لربط التطبيق بالموقع)
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "### بصمة التوقيع" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' \
                | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
          echo "ضع هذه القيمة في متغيّر البيئة \`ANDROID_CERT_SHA256\` على الموقع كي يختفي شريط العنوان داخل التطبيق:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: نقل الـAPK إلى مجلد APK/
        run: |
          mkdir -p APK
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" APK/Khedmet-El-Malak.apk
          ls -lh APK/

      - name: رفع الـAPK كمخرَج للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: Khedmet-El-Malak
          path: APK/Khedmet-El-Malak.apk

      - name: حفظ الـAPK في المستودع
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit_apk == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f APK/Khedmet-El-Malak.apk
          if git diff --cached --quiet; then
            echo "لا تغيير في الـAPK."
          else
            git commit -m "بناء تطبيق أندرويد: APK/Khedmet-El-Malak.apk"
            git push
          fi
