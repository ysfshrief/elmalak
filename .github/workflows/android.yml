# بناء تطبيق أندرويد وإخراج ملف APK داخل المستودع.
#
# البناء يحتاج حزمةَ تطوير أندرويد (Android SDK)، وهي محجوبةٌ عن بيئة التطوير
# التي كُتب فيها هذا المشروع (مضيف جوجل ممنوعٌ بسياسة الشبكة). أمّا خوادم
# GitHub فتأتي بالحزمة مثبّتةً، فيُبنى التطبيق هنا.
#
# التشغيل يدويّ عمدًا: تبويب Actions ← «بناء تطبيق أندرويد» ← Run workflow.
# ولا يُبنى مع كل دفعة، لأن كل بناءٍ بلا مفتاح إصدارٍ ثابت يُنتج توقيعًا
# مختلفًا — وتوقيعٌ مختلف يعني تطبيقًا لا يُحدِّث السابق على أجهزة الناس.
name: بناء تطبيق أندرويد

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "عنوان الموقع المنشور، مثال https://example.com (اتركه فارغًا لاستعمال المتغيّر WEBSITE_URL من إعدادات المستودع)"
        required: false
        default: ""
      commit_apk:
        description: "حفظ الـAPK في مجلد APK/ داخل المستودع"
        type: boolean
        default: true
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تهيئة حزمة أندرويد
        run: |
          # لا تُستعمل إضافةٌ خارجية هنا: `android-actions/setup-android` تطلب
          # حزمة `tools` القديمة التي أُزيلت من مستودع جوجل، فتفشل. وصورةُ
          # ubuntu-latest تأتي بحزمة أندرويد مثبّتةً أصلًا، فتُستعمل كما هي
          # ويُضاف إليها ما ينقص فقط.
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "المنصّات: $(ls "$ANDROID_HOME/platforms")"
          echo "أدوات البناء: $(ls "$ANDROID_HOME/build-tools")"

      - name: تحديد عنوان الموقع
        id: site
        run: |
          # المصدر هو android/gradle.properties المحفوظ في المستودع. والمدخلُ
          # اليدوي يعلوه عند الحاجة فقط (تجربة نسخة معاينة مثلًا).
          URL="${{ github.event.inputs.website_url }}"
          if [ -z "$URL" ]; then
            URL=$(grep -E '^WEBSITE_URL=' android/gradle.properties | cut -d= -f2-)
          fi
          if [ -z "$URL" ] || [[ "$URL" != https://* ]]; then
            echo "::error::عنوان الموقع غير صالح: '$URL'"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "سيُبنى التطبيق على: $URL"
          echo "### الموقع: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: تجهيز مفتاح التوقيع (إن وُجد)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # المفتاح لا يدخل المستودع أبدًا: يُقرأ من أسرار GitHub، ويُكتب في
          # ملفٍ مؤقّت داخل بيئة البناء وحدها. وإن لم يوجد وُقّع البناء بمفتاح
          # التطوير الافتراضي — يُثبَّت على الأجهزة ولا يصلح لمتجر Play.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "مفتاح الإصدار جاهز."
          else
            echo "لا يوجد مفتاح إصدار — سيُوقَّع بمفتاح التطوير."
            {
              echo "> ⚠ **بلا مفتاح إصدار ثابت.** وُقّع هذا البناء بمفتاح تطويرٍ يُولَّد"
              echo "> مع كل تشغيل، فيختلف توقيعُه في كل مرة. والأثر عمليّ:"
              echo "> بناءٌ لاحق لن يُحدِّث التطبيق المثبَّت على الأجهزة (سيُطلب حذفه أولًا)،"
              echo "> وبصمةُ \`ANDROID_CERT_SHA256\` على الموقع ستبطل فيعود شريط العنوان."
              echo ">"
              echo "> للحلّ مرةً واحدة: أنشئ مفتاحًا واحفظه في أسرار المستودع"
              echo "> (\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "> \`ANDROID_KEY_ALIAS\`, \`ANDROID_KEY_PASSWORD\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: بناء التطبيق
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PWEBSITE_URL="${{ steps.site.outputs.url }}"

      - name: بصمة التوقيع (لربط التطبيق بالموقع)
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "### بصمة التوقيع" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' \
                | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
          echo "ضع هذه القيمة في متغيّر البيئة \`ANDROID_CERT_SHA256\` على الموقع كي يختفي شريط العنوان داخل التطبيق:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: التحقّق من صحّة الملف الناتج
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "أدوات البناء: $BUILD_TOOLS"

          echo "— توقيع الملف —"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          echo "— بطاقة التطبيق —"
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK" 2>/dev/null || "$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | head -20

          PKG=$(echo "$BADGING" | grep -oP "package: name='\K[^']+")
          LABEL=$(echo "$BADGING" | grep -oP "application-label:'\K[^']+")
          ICON=$(echo "$BADGING" | grep -oP "application-icon-320:'\K[^']+" || true)

          test "$PKG" = "com.khedmetelmalak.app" || { echo "::error::معرّف الحزمة غير متوقّع: $PKG"; exit 1; }
          test "$LABEL" = "Khedmet El Malak" || { echo "::error::اسم التطبيق غير متوقّع: $LABEL"; exit 1; }

          echo "— العنوان داخل الملف —"
          "$BUILD_TOOLS/aapt2" dump strings "$APK" 2>/dev/null | grep -i "elmalak-sillk" | head -3 \
            || { echo "::error::عنوان الموقع غير موجود داخل الملف"; exit 1; }

          echo "— لا نسخة من الموقع بداخله —"
          if unzip -l "$APK" | grep -E "assets/.*\.(html|js)$" ; then
            echo "::error::يحتوي الملف على صفحات موقع — التطبيق يجب أن يكون غلافًا فقط"; exit 1
          fi
          echo "لا توجد صفحات موقع داخل الملف ✓"

          {
            echo "### التحقّق"
            echo "- معرّف الحزمة: \`$PKG\`"
            echo "- اسم التطبيق: \`$LABEL\`"
            echo "- الأيقونة: \`$ICON\`"
            echo "- الحجم: $(du -h "$APK" | cut -f1)"
            echo "- التوقيع: سليم"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: نقل الـAPK إلى مجلد APK/
        run: |
          mkdir -p APK
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" APK/Khedmet-El-Malak.apk
          ls -lh APK/

      - name: رفع الـAPK كمخرَج للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: Khedmet-El-Malak
          path: APK/Khedmet-El-Malak.apk

      - name: حفظ الـAPK في المستودع
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit_apk == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f APK/Khedmet-El-Malak.apk
          if git diff --cached --quiet; then
            echo "لا تغيير في الـAPK."
          else
            git commit -m "بناء تطبيق أندرويد: APK/Khedmet-El-Malak.apk"
            git push
          fi
