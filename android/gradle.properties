# ————————————————————————————————————————————————————————————————
#  عنوان الموقع الذي يفتحه التطبيق.
#
#  هذا هو المكان الوحيد الذي يُذكر فيه العنوان، وهو الشيء الوحيد الذي يربط
#  التطبيق بالموقع. التطبيق لا يحمل نسخةً من الموقع ولا صفحةً واحدة منه:
#  يفتح ما هو منشورٌ على هذا العنوان الآن. فكلُّ تعديلٍ في الموقع يصل إلى
#  الأجهزة بمجرّد نشره، بلا تطبيقٍ جديد.
#
#  ⚠ ضع هنا عنوان موقعك المنشور (HTTPS) قبل البناء. البناء يفشل عمدًا إن
#    بقي العنوان الافتراضي، كي لا يخرج تطبيقٌ يفتح عنوانًا لا وجود له.
# ————————————————————————————————————————————————————————————————
WEBSITE_URL=https://REPLACE-WITH-YOUR-DEPLOYED-SITE

android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
