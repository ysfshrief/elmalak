# ————————————————————————————————————————————————————————————————
#  عنوان الموقع الذي يفتحه التطبيق.
#
#  هذا هو المكان الوحيد الذي يُذكر فيه العنوان، وهو الشيء الوحيد الذي يربط
#  التطبيق بالموقع. التطبيق لا يحمل نسخةً من الموقع ولا صفحةً واحدة منه:
#  يفتح ما هو منشورٌ على هذا العنوان الآن. فكلُّ تعديلٍ في الموقع يصل إلى
#  الأجهزة بمجرّد نشره، بلا تطبيقٍ جديد.
#
#  العنوان مضبوطٌ على الموقع المنشور. وتغييرُه لاحقًا يحتاج بناءً جديدًا
#  للتطبيق — وهو الشيء الوحيد في التطبيق الذي يحتاج ذلك.
# ————————————————————————————————————————————————————————————————
WEBSITE_URL=https://elmalak-sillk.vercel.app/

android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
