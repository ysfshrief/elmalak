<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" role="img" aria-label="شعار مطرانية البحيرة وتوابعها للأقباط الأرثوذكس">
  <title>مطرانية البحيرة وتوابعها للأقباط الأرثوذكس</title>
  <g fill="none" stroke="#181818" stroke-linecap="round">
    <!-- Coptic cross: equal arms with trefoil (budded) tips -->
    <g stroke-width="9">
      <line x1="120" y1="38" x2="120" y2="128" />
      <line x1="75" y1="83" x2="165" y2="83" />
    </g>
    <g fill="#181818" stroke="none">
      <circle cx="120" cy="30" r="11" />
      <circle cx="120" cy="136" r="11" />
      <circle cx="67" cy="83" r="11" />
      <circle cx="173" cy="83" r="11" />
    </g>
  </g>
  <text x="120" y="172" text-anchor="middle" font-family="Cairo, Tahoma, Arial, sans-serif" font-weight="700" font-size="19" fill="#181818">مطرانية البحيرة وتوابعها</text>
  <text x="120" y="197" text-anchor="middle" font-family="Cairo, Tahoma, Arial, sans-serif" font-weight="700" font-size="19" fill="#181818">للأقباط الأرثوذكس</text>
</svg>
